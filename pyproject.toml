[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroseek"
version = "0.3.1"
description = "Open-source semantic content search engine powered by sentence-transformers and HNSW."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "semantic search",
    "vector search",
    "embeddings",
    "sentence-transformers",
    "hnsw",
    "nlp",
    "information retrieval",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "sentence-transformers>=5.0",
]

[project.optional-dependencies]
fast = [
    "hnswlib>=0.7",
]
dev = [
    "pytest>=9.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/Ricardo-Ceia/NeuroSeek"
Repository = "https://github.com/Ricardo-Ceia/NeuroSeek"
"Bug Tracker" = "https://github.com/Ricardo-Ceia/NeuroSeek/issues"

[project.scripts]
neuroseek = "neuroseek.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuroseek*"]

[tool.setuptools.package-data]
neuroseek = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
