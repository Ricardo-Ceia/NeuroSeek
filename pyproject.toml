[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "neuroseek"
version = "0.1.0"
description = "Production-ready vector database and semantic search engine"
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[project.scripts]
neuroseek = "neuroseek.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuroseek*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
